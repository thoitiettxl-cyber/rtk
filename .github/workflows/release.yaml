name: Release Android (Termux)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0)'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-android:
    name: Build aarch64-linux-android (Termux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27d

      - name: Build
        run: cargo ndk -t arm64-v8a -p 24 build --release
        env:
          RTK_TELEMETRY_URL: ${{ vars.RTK_TELEMETRY_URL }}
          RTK_TELEMETRY_TOKEN: ${{ secrets.RTK_TELEMETRY_TOKEN }}
          OPENSSL_STATIC: 1
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Package
        run: |
          cd target/aarch64-linux-android/release
          tar -czvf ../../../rtk-aarch64-linux-android.tar.gz rtk
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtk-aarch64-linux-android
          path: rtk-aarch64-linux-android.tar.gz

  release:
    name: Create Release
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -name "*.tar.gz" -exec cp {} release/ \;

      - name: Create checksums
        run: |
          cd release
          sha256sum * > checksums.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: release/*
          prerelease: ${{ inputs.prerelease }}
          body: |
            ## RTK ${{ inputs.tag }} — Android (Termux)

            ### Install on Termux

            ```bash
            pkg install wget
            wget https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/rtk-aarch64-linux-android.tar.gz
            tar xzf rtk-aarch64-linux-android.tar.gz
            mv rtk $PREFIX/bin/
            chmod +x $PREFIX/bin/rtk
            rtk --version
            rtk gain
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}